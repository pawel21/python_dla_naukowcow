# Środowisko conda do zajęć Python dla naukowców (alternatywa dla requirements.txt)
# Instalacja:  conda env create -f environment.yml
# Aktywacja:   conda activate py_for_science
name: py_for_science
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - pyarrow>=14
  - requests>=2.28
  - scipy>=1.11
  - statsmodels>=0.14
  - matplotlib>=3.7
  - seaborn>=0.13
  - plotly>=5.18
  - streamlit>=1.30
  - jupyterlab>=4.0
  - ipykernel>=6.25
